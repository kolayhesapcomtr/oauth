version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: oauth_postgres
    environment:
      POSTGRES_DB: oauth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations-001-initial-schema.sql:/docker-entrypoint-initdb.d/01-migrations-001-initial-schema.sql
      - ./database/migrations-002-rbac.sql:/docker-entrypoint-initdb.d/02-migrations-002-rbac.sql
      - ./database/migrations-003-subscriptions.sql:/docker-entrypoint-initdb.d/03-migrations-003-subscriptions.sql
      - ./database/migrations-004-payment-providers.sql:/docker-entrypoint-initdb.d/04-migrations-004-payment-providers.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: oauth_auth_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oauth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev-jwt-secret-key-min-256-bits-change-in-production-xxxxxxxxxxxxxxx
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_SECRET: dev-refresh-secret-key-change-in-production-xxxxxxxxxxxxxxxxx
      JWT_REFRESH_EXPIRES_IN: 7d
      PAYMENT_ENCRYPTION_KEY: dev-payment-encryption-32-chars
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3001,http://localhost:3002
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_USER: ${SMTP_USER:-noreply@oauth.local}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-password}
      SMTP_FROM_NAME: OAuth Platform
      SMTP_FROM_EMAIL: noreply@oauth.local
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./auth-service/src:/app/src
    command: npm run dev

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: oauth_admin_dashboard
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    depends_on:
      - auth-service
    volumes:
      - ./admin-dashboard/src:/app/src
    command: npm run dev

  # TODO: Add example apps when ready
  # crm:
  #   build: ./example-crm
  #   ports:
  #     - "3001:3001"
  #   depends_on:
  #     - auth-service

  # analytics:
  #   build: ./example-analytics
  #   ports:
  #     - "3002:3002"
  #   depends_on:
  #     - auth-service

volumes:
  postgres_data:
